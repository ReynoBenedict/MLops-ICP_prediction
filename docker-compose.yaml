# =============================================================
# Docker Compose — ICP Forecast Intelligence Platform (LK-09)
#
# Services:
#   1. postgres   — MLflow metadata backend
#   2. mlflow     — Tracking server + model registry
#   3. streamlit  — Dashboard + inference UI
#
# Usage:
#   First run (bootstrap ML pipeline):
#     docker compose --profile init run --rm init
#
#   Normal startup:
#     docker compose up -d
#
#   Shutdown:
#     docker compose down
# =============================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: icp-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlflow
    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MLflow Tracking Server ────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: icp-mlflow
    environment:
      BACKEND_STORE_URI: postgresql://mlflow:password@postgres:5432/mlflow
    ports:
      - "5000:5000"
      - "8501:8501"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Streamlit Dashboard ───────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icp-streamlit
    network_mode: service:mlflow
    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    volumes:
      - ./data:/app/data:ro
      - mlflow-artifacts:/mlflow/artifacts




  # ── Init (bootstrap ML pipeline) ─────────────────────────
  # Run once to train + register + promote model:
  #   docker compose --profile init run --rm init
  #
  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icp-init
    network_mode: service:mlflow
    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    volumes:
      - ./data:/app/data
      - mlflow-artifacts:/mlflow/artifacts

    command: >
      sh -c "
        echo '=== Preparing data ===' &&
        python -m src.data_processing.prepare_data &&
        echo '=== Training models ===' &&
        python -m src.training.train &&
        echo '=== Registering best model ===' &&
        python -m src.training.register_model &&
        echo '=== Promoting to Production ===' &&
        python audit_and_promote.py &&
        echo '=== Bootstrap complete ==='
      "
    profiles:
      - init


networks:
  mlops-net:
    driver: bridge

volumes:
  pgdata:
  mlflow-artifacts:
