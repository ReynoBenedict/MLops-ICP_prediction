[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-platform"
version = "2.0.0"
description = "ICP (Indonesian Crude Price) forecasting platform: ML pipeline (icp_ml) and FastAPI backend (icp_api)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
# Core ML dependencies shared by the pipeline and the backend.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<1.8",
    "scipy>=1.11",
    "skops>=0.10",          # safe (non-pickle) model serialization
    "mlflow>=3.1,<4",
    "PyYAML>=6.0",
    "requests>=2.31",
    "defusedxml>=0.7",      # hardened XML parsing for the Bank Indonesia web service
    "openpyxl>=3.1",        # World Bank Pink Sheet workbook; Excel reports
    "reportlab>=4.2,<6",    # branded PDF reports
    "matplotlib>=3.8",      # report charts (Agg backend only)
]

[project.optional-dependencies]
# HTTP backend (container image, infra/docker/api.Dockerfile).
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20",
]
# Cloud adapters: R2 (S3-compatible API) for objects and MLflow artifacts.
cloud = ["boto3>=1.34"]
# Postgres driver for the MLflow tracking store in staging/production.
postgres = ["psycopg2-binary>=2.9"]
# Official ICP decree extraction (ESDM PDFs): text layer via PyMuPDF, scanned pages via Tesseract OCR
# (requires the tesseract binary on PATH or TESSERACT_CMD).
ingest = ["pdfplumber>=0.11", "beautifulsoup4>=4.12", "lxml>=5", "pymupdf>=1.24", "pytesseract>=0.3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
    "moto[s3]>=5",
]

[project.scripts]
icp-ml = "icp_ml.cli:main"
icp-api = "icp_api.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline", "backend"]
include = ["icp_ml*", "icp_api*"]

[tool.setuptools.package-data]
icp_ml = ["py.typed"]
icp_api = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "notebooks", "data", "var", "apps", "packages", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random is not used for security
    "RUF012", # mutable class attrs in pydantic models are fine
    "B008",   # FastAPI Depends() in defaults
    "UP007",  # keep Optional[...] readable on 3.10
    "UP045",
    "E501",   # line length is enforced by `ruff format`; long SQL/message strings are allowed
]

[tool.ruff.lint.isort]
known-first-party = ["icp_ml", "icp_api"]

[tool.ruff.lint.per-file-ignores]
# Legacy ingestion code moved from src/ (offline CLI, Indonesian-language messages).
"pipeline/icp_ml/ingestion/*" = ["S", "BLE", "B904", "B905", "RUF001", "RUF003", "RUF013", "UP031"]
"**/tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.10"
files = ["pipeline/icp_ml", "backend/icp_api"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Legacy ESDM PDF/OCR ingestion moved from src/ (offline CLI); kept as-is apart from safety fixes.
module = "icp_ml.ingestion.icp_pdf"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "backend/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: trains real models (deselect with -m 'not slow')",
    "network: requires internet access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning:mlflow.*",
]
