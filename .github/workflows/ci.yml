# Workflow otomatis untuk proyek ICP Prediction (tugas LK-8)
# Setiap kali ada push atau pull request, GitHub akan menjalankan pipeline ini secara otomatis
#
# Alur pipeline terbagi dua tahap:
#   Tahap 1: lint -> test -> validate-dvc -> ci-summary (pengecekan kode)
#   Tahap 2: retrain -> evaluate -> register (pipeline MLOps)

name: CI + MLOps Automation Pipeline

on:
  push:
    branches: ["**"]       # berjalan di semua branch, bukan hanya main
  pull_request:
    branches: ["**"]       # berjalan juga saat membuat pull request

# Agar folder src/ dapat diimpor langsung saat pytest berjalan
env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:

  # Job 1: cek gaya penulisan kode menggunakan ruff
  # Job ini paling cepat karena tidak perlu install banyak library
  lint:
    name: Lint and Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # ruff akan mendeteksi jika ada gaya penulisan kode yang tidak sesuai standar
      - name: Run ruff linter
        run: ruff check src/ tests/ --output-format=github

  # Job 2: jalankan semua unit test menggunakan pytest
  # Job ini baru berjalan jika lint sudah lulus
  # Pengujian dilakukan di Python 3.10 dan 3.11 sekaligus
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"    # cache agar tidak mengunduh ulang setiap kali run

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Jalankan semua test sekaligus hasilkan laporan coverage
      - name: Run pytest with coverage report
        run: |
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --junitxml=reports/junit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      # Laporan tetap disimpan meski ada test yang gagal
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  # Job 3: pastikan file pointer DVC masih valid dan konsisten
  # Tidak perlu menarik data dari remote, cukup cek statusnya saja
  validate-dvc:
    name: Validate DVC Metadata
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: pip install dvc

      # || true agar pipeline tidak langsung berhenti jika ada peringatan dari DVC
      - name: Check DVC status
        run: |
          dvc status --no-updates 2>&1 || true
          echo "Pengecekan DVC selesai."

  # Job 4: gerbang penutup tahap 1
  # Jika ada salah satu job di atas yang gagal, pipeline berhenti di sini
  # Tahap MLOps baru akan berjalan jika job ini lulus
  ci-summary:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, test, validate-dvc]
    if: always()

    steps:
      - name: Periksa hasil semua job tahap 1
        run: |
          if [[ "${{ needs.lint.result }}"         == "success" &&
                "${{ needs.test.result }}"         == "success" &&
                "${{ needs.validate-dvc.result }}" == "success" ]]; then
            echo "Semua job tahap 1 lulus, pipeline MLOps dapat dilanjutkan."
          else
            echo "Terdapat job yang gagal, pipeline dihentikan."
            echo "  lint:         ${{ needs.lint.result }}"
            echo "  test:         ${{ needs.test.result }}"
            echo "  validate-dvc: ${{ needs.validate-dvc.result }}"
            exit 1
          fi

  # Job 5: latih ulang model prediksi ICP
  # prepare_data.py membuat fitur lag terlebih dahulu,
  # lalu train.py melatih model dan menghasilkan metrics.json
  retrain:
    name: Retrain Model
    runs-on: ubuntu-latest
    needs: ci-summary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Baca dataset.csv, buat kolom lag_1, simpan ke data/processed/clean_data.csv
      - name: Prepare data
        run: python prepare_data.py

      # Latih model menggunakan data yang sudah dibersihkan, hasilkan metrics.json
      - name: Retrain model
        run: python train.py

      # Upload metrics.json agar dapat digunakan oleh job evaluate dan register
      - name: Upload metrics.json
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json
          retention-days: 7

  # Job 6: evaluasi performa model hasil pelatihan
  # Periksa apakah nilai RMSE masih di bawah batas yang ditentukan
  # Jika RMSE melebihi batas, pipeline gagal dan model tidak didaftarkan
  evaluate:
    name: Evaluate RMSE Threshold
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ambil metrics.json yang sudah diunggah oleh job retrain
      - name: Download metrics artifact
        uses: actions/download-artifact@v4
        with:
          name: metrics

      - name: Run evaluate.py
        run: python evaluate.py

  # Job 7: daftarkan model ke registry (simulasi staging MLflow)
  # Langkah terakhir — jika RMSE memenuhi syarat, model resmi dicatat di registry
  register:
    name: Register Model (Staging Simulation)
    runs-on: ubuntu-latest
    needs: evaluate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ambil metrics.json agar register_model_ci.py dapat membaca hasilnya
      - name: Download metrics artifact
        uses: actions/download-artifact@v4
        with:
          name: metrics

      - name: Daftarkan model ke registry
        run: python register_model_ci.py

      # Simpan log registry agar dapat diperiksa di tab Artifacts GitHub
      - name: Upload registry log
        uses: actions/upload-artifact@v4
        with:
          name: registry-log
          path: reports/registry_log.json
          retention-days: 14

      - name: Pipeline selesai
        run: echo "Pipeline MLOps selesai. Model berhasil didaftarkan ke Staging."
