# Continuous integration: lint, type checks, tests, contract drift, builds and secret scan.
# Runs entirely inside the CI runner; it does not deploy anything.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Raw datasets are DVC-managed. Without a configured DVC remote, tests that need the
      # repository data are skipped (they are marked to skip when data/raw/*.csv is absent).
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[api,cloud,dev]" -c requirements/constraints.txt

      - name: Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: API contract is up to date
        run: npm run contracts:check

      - name: Tests
        run: npm test

      - name: Build web app and Worker (dry run, no deploy)
        run: npm run build

      - name: Secret scan
        run: npm run secret-scan
