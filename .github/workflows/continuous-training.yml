# Continuous training (CT) against a DEPLOYED backend, through the public gateway.
#
# Training never runs on the CI runner (a throwaway store would never reach the serving system).
# This workflow drives the backend's job API:
#   1. refreshes the inputs - oil benchmarks (WTI/Brent/Dubai), USD/IDR (JISDOR) and the official
#      ICP series (ESDM decrees + announcements; only verified months are accepted),
#   2. reads the real feature-drift report (PSI) of the production model,
#   3. starts a training job with auto_promote=true - the backend backtests every method, registers
#      the winner and promotes it only if every validation gate passes (beats naive persistence,
#      not worse than production, no-scenario error not worse than naive, loads and predicts),
#   4. waits for the job and fails the workflow if it fails.
#
# Required repository configuration (not present until deployment):
#   vars.ICP_API_BASE_URL  e.g. https://<gateway-host>   (the Cloudflare Worker, not the origin URL)
#   secrets.ICP_ADMIN_TOKEN  an admin token configured in ADMIN_API_TOKENS on the backend
name: Continuous training

on:
  schedule:
    - cron: "0 1 5,12 * *" # 5th and 12th of each month, 01:00 UTC (ESDM publishes ICP early in the month)
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: Why retraining is requested
        type: choice
        options: [scheduled, data_drift, performance_degradation, manual]
        default: manual
      skip_data_refresh:
        description: Skip the data refresh steps
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: ${{ vars.ICP_API_BASE_URL }}
      TOKEN: ${{ secrets.ICP_ADMIN_TOKEN }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set vars.ICP_API_BASE_URL and secrets.ICP_ADMIN_TOKEN (see docs/DEPLOYMENT.md)."
            exit 1
          fi

      - name: Define helpers
        run: |
          cat > "$RUNNER_TEMP/icp.sh" <<'EOF'
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          run_job() {  # $1 = JSON body; waits for a terminal status, exits non-zero unless succeeded
            id=$(api -X POST "$BASE/api/v1/jobs" -d "$1" | jq -r .id)
            echo "job $id"
            for _ in $(seq 1 360); do
              job=$(api "$BASE/api/v1/jobs/$id")
              status=$(echo "$job" | jq -r .status)
              case "$status" in
                succeeded) echo "$job" | jq '{status, result}'; return 0 ;;
                failed|cancelled) echo "$job" | jq '{status, error_code, error_message}'; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::job $id did not finish in time"; return 1
          }
          EOF

      - name: Refresh oil benchmarks (WTI, Brent, Dubai)
        if: ${{ !inputs.skip_data_refresh }}
        run: |
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"ingest_benchmarks","params":{}}'

      - name: Refresh USD/IDR (Bank Indonesia JISDOR)
        if: ${{ !inputs.skip_data_refresh }}
        run: |
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"ingest_fx","params":{}}'

      - name: Refresh official ICP (ESDM)
        if: ${{ !inputs.skip_data_refresh }}
        run: |
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"ingest_icp","params":{"news_pages":6}}'

      - name: Drift report (informational)
        run: |
          . "$RUNNER_TEMP/icp.sh"
          api "$BASE/api/v1/models/drift" | jq '{status, max_psi, current_period, note}' || echo "drift report unavailable"

      - name: Train and promote if validated
        run: |
          . "$RUNNER_TEMP/icp.sh"
          echo "trigger: ${{ inputs.trigger_reason || 'scheduled' }}"
          run_job '{"job_type":"train","params":{"auto_promote":true}}'
