# Continuous training (CT) against a DEPLOYED backend, through the public gateway.
#
# STATUS (2026-10-20): manual only. The monthly schedule was removed because the only deployed backend
# (staging) runs MODEL_SOURCE=bundle, which refuses training/validation/promotion with
# `409 OPERATION_UNAVAILABLE` by design, and it is reachable only while the operator machine and its
# Quick Tunnel are running. In that topology retraining is an operator-local procedure:
#   1. on the operator machine (MLflow store): `npm run dev`, then Operations -> Jobs -> train
#      (or `POST /api/v1/jobs {"job_type":"train","params":{"auto_promote":true}}` locally),
#   2. `node scripts/py.mjs -m icp_api.cli export-model` with the staging store variables
#      (docs/DEPLOYMENT.md, "Update the model").
# Re-add a `schedule:` trigger only when an always-on backend with MODEL_SOURCE=mlflow exists.
#
# What this workflow does when started by hand:
#   1. refreshes the inputs - oil benchmarks (WTI/Brent/Dubai), USD/IDR (JISDOR) and the official
#      ICP series (ESDM decrees + announcements; only verified months are accepted),
#   2. reads the real feature-drift report (PSI) of the production model,
#   3. reads /api/v1/system/status and, ONLY if the backend reports model_source=mlflow and the
#      `train` input is true, starts a training job with auto_promote=true - the backend backtests
#      every method, registers the winner and promotes it only if every validation gate passes.
#      Against a bundle-mode backend the training step is skipped with an explanatory notice.
#
# Required repository configuration (not present until deployment):
#   vars.ICP_API_BASE_URL  e.g. https://<gateway-host>   (the Cloudflare Worker, not the origin URL)
#   secrets.ICP_ADMIN_TOKEN  an admin token configured in ADMIN_API_TOKENS on the backend
name: Continuous training

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: Why retraining is requested
        type: choice
        options: [scheduled, data_drift, performance_degradation, manual]
        default: manual
      skip_data_refresh:
        description: Skip the data refresh steps
        type: boolean
        default: false
      train:
        description: Train and promote (only possible when the backend reports model_source=mlflow)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE: ${{ vars.ICP_API_BASE_URL }}
      TOKEN: ${{ secrets.ICP_ADMIN_TOKEN }}
      # Inputs are passed through the environment, never interpolated into shell code.
      TRIGGER_REASON: ${{ inputs.trigger_reason }}
      SKIP_DATA_REFRESH: ${{ inputs.skip_data_refresh }}
      WANT_TRAIN: ${{ inputs.train }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set vars.ICP_API_BASE_URL and secrets.ICP_ADMIN_TOKEN (see docs/DEPLOYMENT.md)."
            exit 1
          fi
          echo "trigger: ${TRIGGER_REASON:-manual}"

      - name: Define helpers
        run: |
          cat > "$RUNNER_TEMP/icp.sh" <<'EOF'
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          run_job() {  # $1 = JSON body; waits for a terminal status, exits non-zero unless succeeded
            id=$(api -X POST "$BASE/api/v1/jobs" -d "$1" | jq -r .id)
            echo "job $id"
            for _ in $(seq 1 360); do
              job=$(api "$BASE/api/v1/jobs/$id")
              status=$(echo "$job" | jq -r .status)
              case "$status" in
                succeeded) echo "$job" | jq '{status, result}'; return 0 ;;
                failed|cancelled) echo "$job" | jq '{status, error_code, error_message}'; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::job $id did not finish in time"; return 1
          }
          EOF

      - name: Backend status
        id: status
        run: |
          . "$RUNNER_TEMP/icp.sh"
          status=$(api "$BASE/api/v1/system/status")
          echo "$status" | jq '{status, environment, version, schema_version, expected_schema_version, model_source}'
          echo "model_source=$(echo "$status" | jq -r '.model_source // "unknown"')" >> "$GITHUB_OUTPUT"

      - name: Refresh oil benchmarks (WTI, Brent, Dubai)
        if: ${{ env.SKIP_DATA_REFRESH != 'true' }}
        run: |
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"ingest_benchmarks","params":{}}'

      - name: Refresh USD/IDR (Bank Indonesia JISDOR)
        if: ${{ env.SKIP_DATA_REFRESH != 'true' }}
        run: |
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"ingest_fx","params":{}}'

      - name: Refresh official ICP (ESDM)
        if: ${{ env.SKIP_DATA_REFRESH != 'true' }}
        run: |
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"ingest_icp","params":{"news_pages":6}}'

      - name: Drift report (informational)
        run: |
          . "$RUNNER_TEMP/icp.sh"
          api "$BASE/api/v1/models/drift" | jq '{status, max_psi, current_period, note}' || echo "drift report unavailable"

      - name: Train and promote if validated
        env:
          MODEL_SOURCE: ${{ steps.status.outputs.model_source }}
        run: |
          if [ "$WANT_TRAIN" != "true" ]; then
            echo "::notice::Training not requested (input 'train' is false)."
            exit 0
          fi
          if [ "$MODEL_SOURCE" != "mlflow" ]; then
            echo "::notice::Backend reports model_source=$MODEL_SOURCE: it refuses training by design. Retrain on the operator machine and run 'icp-api export-model' (docs/OPERATIONS.md)."
            exit 0
          fi
          . "$RUNNER_TEMP/icp.sh"
          run_job '{"job_type":"train","params":{"auto_promote":true}}'
