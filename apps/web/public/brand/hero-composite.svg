<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Ilustrasi: harga acuan dunia mengalir menuju penetapan Harga Minyak Mentah Indonesia. Ilustratif, bukan peta.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2E4A"/><stop offset="1" stop-color="#16456E"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B5E73"/><stop offset="1" stop-color="#083647"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D99A2B" stop-opacity="0.28"/><stop offset="1" stop-color="#D99A2B" stop-opacity="0"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2B64E" stop-opacity="0"/><stop offset="0.5" stop-color="#F2B64E" stop-opacity="0.9"/><stop offset="1" stop-color="#F2B64E" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="960" height="640" fill="url(#sky)"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <!-- sun / horizon -->
  <circle cx="760" cy="150" r="54" fill="#F2B64E" opacity="0.9"/>
  <circle cx="760" cy="150" r="90" fill="#F2B64E" opacity="0.08"/>
  <!-- sea -->
  <rect x="0" y="430" width="960" height="210" fill="url(#sea)"/>
  <path d="M0 436 Q120 424 240 436 T480 436 T720 436 T960 436 V640 H0Z" fill="#0F6B7E" opacity="0.5"/>
  <!-- refinery silhouette (stylised) -->
  <g fill="#0A2238" opacity="0.95">
    <rect x="60" y="300" width="22" height="134"/><rect x="92" y="330" width="16" height="104"/>
    <rect x="128" y="280" width="30" height="154" rx="4"/><rect x="170" y="356" width="60" height="78" rx="6"/>
    <circle cx="200" cy="356" r="30"/><rect x="246" y="318" width="14" height="116"/><rect x="266" y="340" width="90" height="94" rx="8"/>
    <rect x="300" y="300" width="10" height="40"/><rect x="330" y="296" width="10" height="44"/>
    <path d="M360 434 L360 372 L420 372 L420 434Z"/><rect x="432" y="392" width="40" height="42" rx="4"/>
  </g>
  <!-- flare light on tallest stack -->
  <circle cx="143" cy="270" r="7" fill="#F2B64E"/>
  <!-- tanker -->
  <g>
    <path d="M560 452 L870 452 L850 486 L580 486 Z" fill="#0A2238"/>
    <rect x="770" y="420" width="64" height="32" rx="3" fill="#0A2238"/><rect x="788" y="404" width="26" height="16" rx="2" fill="#0A2238"/>
    <rect x="590" y="440" width="150" height="12" rx="6" fill="#0A2238"/>
    <path d="M560 452 L870 452 L850 486 L580 486 Z" fill="#D99A2B" opacity="0.18"/>
  </g>
  <!-- price curve across the sky -->
  <path d="M40 250 C 160 240, 220 300, 320 262 S 480 180, 600 210 S 760 120, 900 96" fill="none" stroke="#F2B64E" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 250 C 160 240, 220 300, 320 262 S 480 180, 600 210 S 760 120, 900 96 V 300 H 40 Z" fill="url(#band)"/>
  <g fill="#FFFFFF">
    <circle cx="320" cy="262" r="6"/><circle cx="600" cy="210" r="6"/><circle cx="900" cy="96" r="6"/>
  </g>
  <!-- labels (illustrative) -->
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-weight="600" fill="#FFFFFF">
    <text x="60" y="60" font-size="14" opacity="0.7" letter-spacing="2">BRENT · DUBAI · WTI</text>
    <text x="60" y="88" font-size="26">Harga acuan dunia</text>
    <text x="640" y="580" font-size="14" opacity="0.7" letter-spacing="2" text-anchor="end">KEMENTERIAN ESDM</text>
    <text x="640" y="608" font-size="26" text-anchor="end">Penetapan ICP bulanan</text>
  </g>
  <!-- flow arrow -->
  <path d="M250 110 L440 110" stroke="url(#glow)" stroke-width="3"/>
  <text x="60" y="624" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.55">Ilustrasi · bukan peta atau lokasi faktual</text>
</svg>
