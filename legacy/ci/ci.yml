  name: CI + MLOps Pipeline

  on:
    push:
      branches: ["main"]
    pull_request:
      branches: ["main"]

  permissions:
    contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  env:
    PYTHONPATH: ${{ github.workspace }}/src

  jobs:
    # LINT & STYLE CHECK
    lint:
      name: Lint Check
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            cache: "pip"
        - run: pip install ruff
        - run: ruff check . --output-format=github

    # UNIT TESTING (MATRIX)
    test:
      name: Tests (Python ${{ matrix.python-version }})
      runs-on: ubuntu-latest
      timeout-minutes: 10
      strategy:
        fail-fast: false
        matrix:
          python-version: ["3.10", "3.11"]
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            cache: "pip"
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest pytest-cov
        - name: Run tests
          run: |
            mkdir -p reports
            python -m pytest tests/ \
              --tb=short --strict-markers -v \
              --junitxml=reports/junit.xml \
              --cov=src --cov-report=xml:reports/coverage.xml
        - uses: actions/upload-artifact@v4
          if: always()
          with:
            name: test-reports-py${{ matrix.python-version }}
            path: reports/
            retention-days: 7
            if-no-files-found: ignore

    # DVC VALIDATION
    validate-dvc:
      name: DVC Metadata
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            cache: "pip"
        - run: pip install dvc
        - name: Check DVC status
          run: |
            set -e
            dvc status --no-updates 2>&1 || echo "DVC status check completed with warnings"

    # STREAMLIT SMOKE TEST
    streamlit-smoke-test:
      name: Smoke Test
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            cache: "pip"
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Validate syntax
          run: |
            set -e
            python -m py_compile app.py
            find pages -name "*.py" -exec python -m py_compile {} \;
        - name: Launch App
          run: |
            nohup streamlit run app.py --server.headless true > streamlit.log 2>&1 &
        - name: Health Check (Retry Loop)
          run: |
            timeout=60
            while [ $timeout -gt 0 ]; do
              if curl --fail http://localhost:8501/_stcore/health; then
                echo "Streamlit is healthy"
                exit 0
              fi
              echo "Waiting for Streamlit... ($timeout seconds remaining)"
              sleep 5
              timeout=$((timeout-5))
            done
            echo "Streamlit health check failed"
            cat streamlit.log
            exit 1

    # CI GATE
    ci-summary:
      name: Gate
      runs-on: ubuntu-latest
      timeout-minutes: 5
      needs: [lint, test, validate-dvc, streamlit-smoke-test]
      if: always()
      steps:
        - name: Verify Stage 1 Results
          run: |
            if [[ "${{ needs.lint.result }}" == "success" &&
                  "${{ needs.test.result }}" == "success" &&
                  "${{ needs.validate-dvc.result }}" == "success" &&
                  "${{ needs.streamlit-smoke-test.result }}" == "success" ]]; then
              echo "All validations passed"
            else
              echo "Validation failed"
              exit 1
            fi

    # MLOPS PIPELINE
    mlops-pipeline:
      name: MLOps Pipeline
      runs-on: ubuntu-latest
      timeout-minutes: 15
      needs: ci-summary
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            cache: "pip"
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Fetch WTI data
          run: |
            set -e
            python -m src.data_ingestion.fetch_wti
        - name: Execute Pipeline
          run: |
            set -e
            python -m src.data_processing.prepare_data
            python -m src.training.train
            python -m src.training.evaluate
            python -m src.training.register_model
        - uses: actions/upload-artifact@v4
          if: always()
          with:
            name: metrics
            path: metrics.json
            retention-days: 7
            if-no-files-found: ignore