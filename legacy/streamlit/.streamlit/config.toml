[theme]
base = "light"
primaryColor = "#1f77b4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#111111"
font = "sans serif"

[server]
headless = true
maxUploadSize = 200
runOnSave = false
fileWatcherType = "none"
enableWebsocketCompression = false
enableCORS = false
enableXsrfProtection = false
address = "0.0.0.0"
port = 8501

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501
