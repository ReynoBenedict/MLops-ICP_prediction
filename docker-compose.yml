# Optional containerized local stack. The primary local workflow is `npm run dev` (no Docker needed).
#
#   docker compose up --build api                          # backend only, http://localhost:8000
#   docker compose --profile observability up --build      # + Prometheus (9090) and Grafana (3000)
#   docker compose exec api python -m icp_api.cli bootstrap   # first-time: train + promote a model
#
# Secrets are read from .env (gitignored). Nothing here is used for deployment.
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: icp-api:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      API_HOST: 0.0.0.0
      SQLITE_PATH: /app/var/metadata.db
      LOCAL_OBJECT_DIR: /app/var/objects
      MLFLOW_TRACKING_URI: sqlite:////app/var/mlflow/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /app/var/mlflow/artifacts
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8787
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api-var:/app/var
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.2
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in your shell or .env; the fallback is for a throwaway local container only.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/icp_dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

volumes:
  api-var:
  prometheus-data:
  grafana-data:
