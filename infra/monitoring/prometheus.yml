# Prometheus scrape configuration for the optional local observability profile
# (docker compose --profile observability up). Metrics are defined in backend/icp_api/metrics.py.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: icp-platform
    environment: local

scrape_configs:
  - job_name: icp-api
    metrics_path: /metrics
    # If METRICS_TOKEN is set for the API, add:  authorization: { credentials: <token> }
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: icp-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
