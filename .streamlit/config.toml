[theme]
base = "light"
primaryColor = "#1f77b4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#111111"
font = "sans serif"

[server]
headless = true
maxUploadSize = 200

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[ui]
hideTopBar = false
hideFooterAndHeader = false
